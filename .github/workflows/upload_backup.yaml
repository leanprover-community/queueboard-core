name: Build sanitized analytics snapshot

on:
  workflow_dispatch:  # manual trigger
    inputs:
      backup_id:
        description: "Optional Heroku PGBackups ID (e.g., b123); defaults to latest"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: analytics_source
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by psql / export scripts
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/analytics_source

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: "Setup Python"
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      # - name: "Setup uv"
      #   uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5

      - name: Install system dependencies (Postgres 17 client)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl postgresql-client-17

      - name: Prepare artifact directories
        run: mkdir -p artifacts/data

      - name: Install Python dependencies for scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install "psycopg[binary]==3.2.1" "pandas==2.2.3" "pyarrow==17.0.0"

      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      # 1. Download latest Heroku PG backup (inline)
      - name: Download Heroku PG backup
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          BACKUP_ID: ${{ inputs.backup_id }}
        run: |
          bash scripts/download_backup.sh \
            ${BACKUP_ID:+-b "$BACKUP_ID"} \
            -o backup.dump \
            -i artifacts/backup-info.txt

      # 2. Restore backup into local Postgres (inline)
      - name: Restore backup into local Postgres
        env:
          PGPASSWORD: postgres
        run: |
          # Wait for Postgres service to be ready (just in case)
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done

          # Restore the Heroku custom-format dump into analytics_source
          pg_restore --verbose --clean --no-acl --no-owner \
            --if-exists \
            -h localhost -p 5432 -U postgres \
            -d analytics_source \
            backup.dump

      # 3. Sanitize the database (per docs/design-decisions/016-sanitized-backups.md)
      - name: Sanitize database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python scripts/sanitize_backup.py \
            --database-url "$DATABASE_URL" \
            --manifest artifacts/sanitize-manifest.json

      # 4. Export sanitized data for offline analysis (inline)
      - name: Export analytics datasets
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python scripts/export_for_analysis.py \
            --database-url "$DATABASE_URL" \
            --output-dir artifacts/data

      # 5. Dump sanitized Postgres
      - name: Create sanitized Postgres dump
        env:
          PGPASSWORD: postgres
        run: |
          PGPASSWORD=postgres pg_dump \
            --no-acl --no-owner \
            -h localhost -p 5432 -U postgres \
            -d analytics_source \
            -Fc \
            -f artifacts/sanitized.dump

      # 6. Upload artifacts
      - name: Upload sanitized Postgres dump
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: sanitized-pg-dump
          path: artifacts/sanitized.dump

      - name: Upload analytics datasets
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: analytics-datasets
          path: artifacts/data

      - name: Upload backup metadata
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: backup-metadata
          path: |
            artifacts/backup-info.txt
            artifacts/sanitize-manifest.json

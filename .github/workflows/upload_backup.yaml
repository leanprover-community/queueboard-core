name: Build sanitized analytics snapshot

# Where the dump comes from is the repository variable BACKUP_SOURCE:
# - unset or "heroku": the Heroku app's newest PGBackups backup (secrets HEROKU_API_KEY, HEROKU_APP_NAME);
# - "s3": the newest dump holding table data in an S3-compatible bucket (scripts/download_s3_dump.py),
#   keyed <prefix>-YYYYMMDDTHHMMSSZ.dump. Secrets BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
#   BACKUP_S3_ACCESS_KEY_ID and BACKUP_S3_SECRET_ACCESS_KEY (read-only credentials suffice); optional
#   variables BACKUP_S3_KEY_PREFIX (default queueboard) and BACKUP_S3_REGION (default us-east-1).
# Either way the dump is a pg_dump custom-format archive from Postgres 18 or older.

on:
  workflow_dispatch:  # manual trigger
    inputs:
      backup_id:
        description: "Heroku source: optional PGBackups ID (e.g., b123); defaults to latest"
        required: false
        type: string
      dump_key:
        description: "S3 source: optional object key (e.g., queueboard-20260101T000000Z.dump); defaults to the newest holding table data"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: analytics_source
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by psql / export scripts
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/analytics_source
      BACKUP_SOURCE: ${{ vars.BACKUP_SOURCE || 'heroku' }}

    steps:
      - name: Check the backup source
        env:
          BACKUP_ID: ${{ inputs.backup_id }}
          DUMP_KEY: ${{ inputs.dump_key }}
          # Only tested for emptiness here, so a missing one fails the run at once.
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          case "$BACKUP_SOURCE" in
            heroku)
              if [ -n "$DUMP_KEY" ]; then
                echo "::error::dump_key applies to the s3 source only; this run's source is heroku"
                exit 1
              fi ;;
            s3)
              if [ -n "$BACKUP_ID" ]; then
                echo "::error::backup_id applies to the heroku source only; for the s3 source, give dump_key"
                exit 1
              fi
              missing=""
              for name in BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
                if [ -z "${!name}" ]; then
                  missing="$missing $name"
                fi
              done
              if [ -n "$missing" ]; then
                echo "::error::The s3 source needs these repository secrets:$missing"
                exit 1
              fi ;;
            *)
              echo "::error::The BACKUP_SOURCE variable must be unset, heroku or s3, not '$BACKUP_SOURCE'"
              exit 1 ;;
          esac
          echo "Backup source: $BACKUP_SOURCE"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # - name: "Setup uv"
      #   uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5

      # pg_restore reads dumps from its own major version and older ones. The script puts this
      # version's tools first on PATH: the runner's own, older Postgres would otherwise win whenever a
      # command names no host, as `pg_restore --list` doesn't.
      - name: Install system dependencies (Postgres 18 client)
        run: bash scripts/install_postgres_client.sh 18

      - name: Prepare artifact directories
        run: mkdir -p artifacts/data

      - name: Install Python dependencies for scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-analytics.txt

      - name: Install Heroku CLI
        if: env.BACKUP_SOURCE == 'heroku'
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      # 1. Download the dump: Heroku's latest backup, or the bucket's newest dump holding table data
      - name: Download Heroku PG backup
        if: env.BACKUP_SOURCE == 'heroku'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          HEROKU_APP_NAME: ${{ secrets.HEROKU_APP_NAME }}
          BACKUP_ID: ${{ inputs.backup_id }}
        run: |
          bash scripts/download_backup.sh \
            ${BACKUP_ID:+-b "$BACKUP_ID"} \
            -o backup.dump \
            -i artifacts/backup-info.txt

      - name: Download dump from the S3-compatible bucket
        if: env.BACKUP_SOURCE == 's3'
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_KEY_PREFIX: ${{ vars.BACKUP_S3_KEY_PREFIX }}
          DUMP_KEY: ${{ inputs.dump_key }}
        run: |
          python scripts/download_s3_dump.py \
            ${DUMP_KEY:+--key "$DUMP_KEY"} \
            -o backup.dump \
            -i artifacts/backup-info.txt

      # 2. Restore backup into local Postgres (inline)
      - name: Restore backup into local Postgres
        env:
          PGPASSWORD: postgres
        run: |
          # Wait for Postgres service to be ready (just in case)
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done

          # Restore the custom-format dump into analytics_source
          pg_restore --verbose --clean --no-acl --no-owner \
            --if-exists \
            -h localhost -p 5432 -U postgres \
            -d analytics_source \
            backup.dump

          # A dump of a freshly migrated database has every table but no rows: publish no snapshot of that.
          prs="$(psql -h localhost -p 5432 -U postgres -d analytics_source -tAc 'SELECT count(*) FROM syncer_pullrequest')"
          echo "Pull requests restored: $prs"
          if [ "$prs" -eq 0 ]; then
            echo "::error::The restored database holds no pull requests: the dump is of an empty database"
            exit 1
          fi

      # 3. Sanitize the database (per docs/design-decisions/016-sanitized-backups.md)
      - name: Sanitize database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python scripts/sanitize_backup.py \
            --database-url "$DATABASE_URL" \
            --manifest artifacts/sanitize-manifest.json

      # 4. Export sanitized data for offline analysis (inline)
      - name: Export analytics datasets
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python scripts/export_for_analysis.py \
            --database-url "$DATABASE_URL" \
            --output-dir artifacts/data

      # 5. Dump sanitized Postgres
      - name: Create sanitized Postgres dump
        env:
          PGPASSWORD: postgres
        run: |
          PGPASSWORD=postgres pg_dump \
            --no-acl --no-owner \
            -h localhost -p 5432 -U postgres \
            -d analytics_source \
            -Fc \
            -f artifacts/sanitized.dump

      # 6. Upload artifacts
      - name: Upload sanitized Postgres dump
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-pg-dump
          path: artifacts/sanitized.dump

      - name: Upload analytics datasets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analytics-datasets
          path: artifacts/data

      - name: Upload backup metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-metadata
          path: |
            artifacts/backup-info.txt
            artifacts/sanitize-manifest.json

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1

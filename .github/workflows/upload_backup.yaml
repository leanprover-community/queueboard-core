name: Build sanitized analytics snapshot

# The dump is the newest one holding table data in an S3-compatible bucket (scripts/download_s3_dump.py),
# keyed <prefix>-YYYYMMDDTHHMMSSZ.dump. Secrets BACKUP_S3_ENDPOINT, BACKUP_S3_BUCKET,
# BACKUP_S3_ACCESS_KEY_ID and BACKUP_S3_SECRET_ACCESS_KEY (read-only credentials suffice); optional
# variables BACKUP_S3_KEY_PREFIX (default queueboard) and BACKUP_S3_REGION (default us-east-1).
# The dump is a pg_dump custom-format archive from Postgres 18 or older.

on:
  workflow_dispatch:  # manual trigger
    inputs:
      dump_key:
        description: "Optional object key (e.g., queueboard-20260101T000000Z.dump); defaults to the newest holding table data"
        required: false
        type: string
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC every day

jobs:
  build-snapshot:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: analytics_source
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by psql / export scripts
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/analytics_source

    steps:
      - name: Check the bucket's secrets
        env:
          # Only tested for emptiness here, so a missing one fails the run at once.
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY_ID BACKUP_S3_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::The bucket needs these repository secrets:$missing"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Python"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # - name: "Setup uv"
      #   uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5

      # pg_restore reads dumps from its own major version and older ones. The script puts this
      # version's tools first on PATH: the runner's own, older Postgres would otherwise win whenever a
      # command names no host, as `pg_restore --list` doesn't.
      - name: Install system dependencies (Postgres 18 client)
        run: bash scripts/install_postgres_client.sh 18

      - name: Prepare artifact directories
        run: mkdir -p artifacts/data

      - name: Install Python dependencies for scripts
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r scripts/requirements-analytics.txt

      # 1. Download the dump: the one dump_key names, or the bucket's newest holding table data
      - name: Download dump from the S3-compatible bucket
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_REGION: ${{ vars.BACKUP_S3_REGION }}
          BACKUP_S3_KEY_PREFIX: ${{ vars.BACKUP_S3_KEY_PREFIX }}
          DUMP_KEY: ${{ inputs.dump_key }}
        run: |
          python scripts/download_s3_dump.py \
            ${DUMP_KEY:+--key "$DUMP_KEY"} \
            -o backup.dump \
            -i artifacts/backup-info.txt

      # 2. Restore backup into local Postgres (inline)
      - name: Restore backup into local Postgres
        env:
          PGPASSWORD: postgres
        run: |
          # Wait for Postgres service to be ready (just in case)
          for i in {1..10}; do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "Postgres is ready"
              break
            fi
            echo "Waiting for Postgres..."
            sleep 3
          done

          # Restore the custom-format dump into analytics_source
          pg_restore --verbose --clean --no-acl --no-owner \
            --if-exists \
            -h localhost -p 5432 -U postgres \
            -d analytics_source \
            backup.dump

          # A dump of a freshly migrated database has every table but no rows: publish no snapshot of that.
          prs="$(psql -h localhost -p 5432 -U postgres -d analytics_source -tAc 'SELECT count(*) FROM syncer_pullrequest')"
          echo "Pull requests restored: $prs"
          if [ "$prs" -eq 0 ]; then
            echo "::error::The restored database holds no pull requests: the dump is of an empty database"
            exit 1
          fi

      # 3. Sanitize the database (per docs/design-decisions/016-sanitized-backups.md)
      - name: Sanitize database
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python scripts/sanitize_backup.py \
            --database-url "$DATABASE_URL" \
            --manifest artifacts/sanitize-manifest.json

      # 4. Export sanitized data for offline analysis (inline)
      - name: Export analytics datasets
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          python scripts/export_for_analysis.py \
            --database-url "$DATABASE_URL" \
            --output-dir artifacts/data

      # 5. Dump sanitized Postgres
      - name: Create sanitized Postgres dump
        env:
          PGPASSWORD: postgres
        run: |
          PGPASSWORD=postgres pg_dump \
            --no-acl --no-owner \
            -h localhost -p 5432 -U postgres \
            -d analytics_source \
            -Fc \
            -f artifacts/sanitized.dump

      # 6. Upload artifacts
      - name: Upload sanitized Postgres dump
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sanitized-pg-dump
          path: artifacts/sanitized.dump

      - name: Upload analytics datasets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: analytics-datasets
          path: artifacts/data

      - name: Upload backup metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backup-metadata
          path: |
            artifacts/backup-info.txt
            artifacts/sanitize-manifest.json

  workflow-keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: liskin/gh-workflow-keepalive@f72ff1a1336129f29bf0166c0fd0ca6cf1bcb38c # v1.2.1

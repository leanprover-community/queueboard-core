name: CI checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: "Setup Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "23"

      - name: "Setup uv"
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install queueboard-core (editable)
        run: |
          uv venv
          uv pip install -e .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run Zulip prefs frontend tests
        working-directory: qb_site/zulip_bot/frontend
        run: |
          npm ci
          npm test

      - name: Test snapshot generation
        run: |
          uv run python -m queueboard.test_snapshot

      - name: Test process helpers
        run: |
          uv run python -m queueboard.test_process

      - name: Run dashboard_data in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard_data "all-open-PRs-test.json"

      - name: Run dashboard in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard

      - name: Upload gh-pages preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-pages-preview
          path: |
            test/newtest/api
            test/newtest/gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Docker Compose checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repo_check_compose.sh

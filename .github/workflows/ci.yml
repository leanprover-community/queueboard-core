name: CI checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: "Setup uv"
        uses: astral-sh/setup-uv@681c641aba71e4a1c380be3ab5e12ad51f415867 # v7.1.6

      - name: Install queueboard-core (editable)
        run: |
          uv venv
          uv pip install -e .

      - name: Check reviewer-topics.json
        run: |
          uv run python -m queueboard.test_reviewer_topics

      - name: Test snapshot generation
        run: |
          uv run python -m queueboard.test_snapshot

      - name: Run dashboard_data in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard_data "all-open-PRs-test.json"

      - name: Run dashboard in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard

      - name: Upload gh-pages preview
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: gh-pages-preview
          path: |
            test/newtest/api
            test/newtest/gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repo_check_compose.sh

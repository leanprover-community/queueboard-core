name: CI checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: "Setup Python"
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: "Setup Node"
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "23"

      - name: "Setup uv"
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57 # v8.0.0

      - name: Install queueboard-core (editable)
        run: |
          uv venv
          uv pip install -e .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run Zulip prefs frontend tests
        working-directory: qb_site/zulip_bot/frontend
        run: |
          npm ci
          npm test

      - name: Check reviewer-topics.json
        run: |
          uv run python -m queueboard.test_reviewer_topics

      - name: Test snapshot generation
        run: |
          uv run python -m queueboard.test_snapshot

      - name: Test process helpers
        run: |
          uv run python -m queueboard.test_process

      - name: Run dashboard_data in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard_data "all-open-PRs-test.json"

      - name: Run dashboard in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard

      - name: Upload gh-pages preview
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: gh-pages-preview
          path: |
            test/newtest/api
            test/newtest/gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Docker Compose checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repo_check_compose.sh

name: CI checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Setup Python"
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: "Setup Node"
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "23"

      - name: "Setup uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install queueboard-core (editable)
        run: |
          uv venv
          uv pip install -e .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run Zulip prefs frontend tests
        working-directory: qb_site/zulip_bot/frontend
        run: |
          npm ci
          npm test

      - name: Test snapshot generation
        run: |
          uv run python -m queueboard.test_snapshot

      - name: Test process helpers
        run: |
          uv run python -m queueboard.test_process

      - name: Test PR state classification
        run: |
          uv run python -m queueboard.classify_pr_state

      - name: Test PR state evolution
        run: |
          uv run python -m queueboard.test_state_evolution

      - name: Run dashboard_data in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard_data "all-open-PRs-test.json"

      - name: Run dashboard in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard

      - name: Upload gh-pages preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-pages-preview
          path: |
            test/newtest/api
            test/newtest/gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker Compose checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repo_check_compose.sh

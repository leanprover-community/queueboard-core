name: CI checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: "Setup Python"
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: "Setup Node"
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "23"

      - name: "Setup uv"
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install queueboard-core (editable)
        run: |
          uv venv
          uv pip install -e .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Run Zulip prefs frontend tests
        working-directory: qb_site/zulip_bot/frontend
        run: |
          npm ci
          npm test

      - name: Test snapshot generation
        run: |
          uv run python -m queueboard.test_snapshot

      - name: Test process helpers
        run: |
          uv run python -m queueboard.test_process

      - name: Test PR state classification
        run: |
          uv run python -m queueboard.classify_pr_state

      - name: Test PR state evolution
        run: |
          uv run python -m queueboard.test_state_evolution

      - name: Run dashboard_data in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard_data "all-open-PRs-test.json"

      - name: Run dashboard in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard

      - name: Upload gh-pages preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gh-pages-preview
          path: |
            test/newtest/api
            test/newtest/gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Docker Compose checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/repo_check_compose.sh

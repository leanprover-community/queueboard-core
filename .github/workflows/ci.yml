name: CI checks

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: "Setup Python"
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: "Setup uv"
        uses: astral-sh/setup-uv@85856786d1ce8acfbcc2f13a5f3fbd6b938f9f41 # v7.1.2

      - name: Install queueboard-core (editable)
        run: |
          uv venv
          uv pip install -e .

      - name: Check reviewer-topics.json
        run: |
          uv run python -m queueboard.test_reviewer_topics

      - name: Run dashboard_data in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard_data "all-open-PRs-test.json"

      - name: Run dashboard in test/newtest
        working-directory: test/newtest
        run: |
          uv run python -m queueboard.dashboard

      - name: Upload gh-pages preview
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: gh-pages-preview
          path: |
            test/newtest/api
            test/newtest/gh-pages

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Docker Compose checks
        run: bash scripts/repo_check_compose.sh

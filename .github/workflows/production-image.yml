name: Production image

# Builds Dockerfile.production. Pull requests and merge-queue runs only check that it builds;
# pushes to master also publish it to GHCR (see docs/production_image.md).

on:
  push:
    branches: ["master"]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A publish that has started is never cancelled, and publishes run one at a time, so `latest`
  # ends on the newest commit.
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  IMAGE: ghcr.io/leanprover-community/queueboard-core

jobs:
  build:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha
          push: false

  publish:
    if: github.event_name == 'push' && github.repository == 'leanprover-community/queueboard-core'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the image to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Short commit hash
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.production
          platforms: linux/amd64
          build-args: REVISION=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          {
            echo "### Published \`${IMAGE}\`"
            echo
            echo "Tags: \`sha-${SHORT_SHA}\`, \`latest\`. To pin this build by digest:"
            echo
            echo '```'
            echo "${IMAGE}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

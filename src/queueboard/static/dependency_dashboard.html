            currentFilter.layout = document.getElementById("layoutMode").value;
            if (clearFocus) currentFilter.focus = null;
            applyFilters();
        }

        function writeFiltersToURL() {
            const url = new URL(window.location);
            const setOrDelete = (key, value) => {
                if (value) {
                    url.searchParams.set(key, value);
                } else {
                    url.searchParams.delete(key);
                }
            };

            setOrDelete('search', currentFilter.search.trim());
            setOrDelete('singletons', currentFilter.showSingletons ? 'true' : '');
            setOrDelete('layout', currentFilter.layout !== "columns" ? currentFilter.layout : '');
            // Values are percent-encoded individually: a label or handle containing a comma
            // would otherwise split into two on the way back in.
            const encodeFacet = kind => (facetIsRestricting(kind) ? [...currentFilter[kind]].map(encodeURIComponent).join(',') : '');
            setOrDelete('labels', encodeFacet("labels"));
            setOrDelete('authors', encodeFacet("authors"));
            setOrDelete('focus', currentFilter.focus !== null ? String(currentFilter.focus) : '');

            window.history.replaceState({}, '', url);
        }

        function resetFilters() {
            document.getElementById("searchFilter").value = "";
            document.getElementById("showSingletons").checked = false;
            document.getElementById("layoutMode").value = "columns";
            currentFilter.labels = null;
            currentFilter.authors = null;
            currentFilter.focus = null;
            syncFacetCheckboxes();
            updateFacetSummaries();
            updateFilters(true);
        }

        function loadFiltersFromURL() {
            const url = new URL(window.location);
            const searchParam = url.searchParams.get('search');
            const singletonsParam = url.searchParams.get('singletons');
            const layoutParam = url.searchParams.get("layout");
            const focusParam = url.searchParams.get("focus");

            if (searchParam) {
                document.getElementById("searchFilter").value = searchParam;
                currentFilter.search = searchParam;
            }

            if (singletonsParam === 'true') {
                document.getElementById("showSingletons").checked = true;
                currentFilter.showSingletons = true;
            }

            if (layoutParam === "force" || layoutParam === "columns") {
                document.getElementById("layoutMode").value = layoutParam;
                currentFilter.layout = layoutParam;
            }

            ["labels", "authors"].forEach(kind => {
                const raw = url.searchParams.get(kind);
                if (raw) {
                    const values = raw.split(',').map(value => {
                        try {
                            return decodeURIComponent(value.trim());
                        } catch (error) {
                            return value.trim();
                        }
                    }).filter(Boolean);
                    if (values.length > 0) currentFilter[kind] = new Set(values);
                }
            });

            // ?focus=<number> is how the queueboard's "unblocks" column links into this page:
            // show just that PR's connected component, with the PR itself ringed.
            if (focusParam && /^\d+$/.test(focusParam)) {
                currentFilter.focus = Number.parseInt(focusParam, 10);
            }
        }

        function resetZoom() {
            fitGraphToViewport(350);
        }

        document.getElementById("searchFilter").addEventListener("input", () => updateFilters(true));
        document.getElementById("showSingletons").addEventListener("change", () => updateFilters());
        document.getElementById("layoutMode").addEventListener("change", () => updateFilters());
        document.getElementById("resetFiltersBtn").addEventListener("click", resetFilters);
        document.getElementById("resetZoomBtn").addEventListener("click", resetZoom);
        document.getElementById("zoomInBtn").addEventListener("click", () => svg.transition().duration(250).call(zoom.scaleBy, 1.2));
        document.getElementById("zoomOutBtn").addEventListener("click", () => svg.transition().duration(250).call(zoom.scaleBy, 1 / 1.2));
        document.getElementById("zoomResetBtn").addEventListener("click", resetZoom);

        document.querySelectorAll(".facet-actions button").forEach(button => {
            button.addEventListener("click", () => setFacetSelection(button.dataset.facet, button.dataset.action === "all"));
        });

        document.getElementById("themeToggle").addEventListener("click", () => {
            applyTheme(currentTheme() === "dark" ? "light" : "dark", true);
        });

        loadFiltersFromURL();
        applyTheme(storedTheme() === "dark" ? "dark" : "light", false);
        initializeSVG();
        loadData();

        document.addEventListener("click", (event) => {
            // Close an open facet dropdown when clicking outside it.
            document.querySelectorAll("details.facet[open]").forEach(facet => {
                if (!facet.contains(event.target)) facet.open = false;
            });

            const tooltip = document.getElementById("tooltip");
            if (!tooltip.classList.contains("visible")) return;
            if (tooltip.contains(event.target)) return;
            if (event.target.closest(".node")) return;
            closeTooltip();
        });

        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                document.querySelectorAll("details.facet[open]").forEach(facet => { facet.open = false; });
                closeTooltip();
            }
        });

        window.addEventListener('resize', () => {
            graphWidth = window.innerWidth - 40;
            graphHeight = window.innerHeight - 250;

            svg.attr("width", graphWidth).attr("height", graphHeight);

            if (simulation) {
                simulation.force("center", d3.forceCenter(graphWidth / 2, graphHeight / 2));
                simulation.alpha(0.3).restart();
            } else if (graphData) {
                createVisualization(graphData);
            }
        });
    </script>
</body>
</html>

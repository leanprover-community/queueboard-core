<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>PR Dependency Graph Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
    <script>
        // Runs before the body is parsed so an opted-in browser never flashes the light theme.
        try {
            if (localStorage.getItem("queueboard-dependency-theme") === "dark") {
                document.documentElement.dataset.theme = "dark";
            }
        } catch (error) {
            // Storage can be unavailable (private windows, blocked site data); light is the default anyway.
        }
    </script>
    <style>
        /* Colours live in custom properties so the palette resolves once per theme, and so the
           legend and the nodes can never drift apart: both read the same tokens.

           Light is the default whether or not this browser has a stored preference, and the OS
           setting is deliberately not consulted: no other queueboard page has a dark mode, so
           someone arriving from index.html should not find this one inverted. Dark is opt-in,
           through the toggle in the controls row, and selected by the data-theme attribute. */
        :root {
            color-scheme: light;

            --page-bg: #f5f5f5;
            --panel-bg: #ffffff;
            --panel-bg-alpha: rgba(255, 255, 255, 0.95);
            --ink: #1f2328;
            --ink-muted: #59636e;
            --rule: #d8dee4;
            --control-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --edge: #8c959f;
            --edge-opacity: 0.7;
            --highlight-bg: #fff3a3;

            /* Node fills, by queue status. Keep in sync with NODE_CATEGORIES in the script. */
            --cat-queue: #2da44e;
            --cat-author: #c2670a;
            --cat-blocked: #cf222e;
            --cat-notready: #8c959f;
            --cat-merging: #8250df;
            --cat-other: #6e7781;
        }

        :root[data-theme="dark"] {
            color-scheme: dark;

            --page-bg: #0d1117;
            --panel-bg: #161b22;
            --panel-bg-alpha: rgba(22, 27, 34, 0.95);
            --ink: #e6edf3;
            --ink-muted: #9198a1;
            --rule: #30363d;
            --control-bg: #0d1117;
            --shadow: rgba(0, 0, 0, 0.5);
            --edge: #9198a1;
            --edge-opacity: 0.9;
            --highlight-bg: #9e6a03;

            --cat-queue: #3fb950;
            --cat-author: #d29922;
            --cat-blocked: #f85149;
            --cat-notready: #8b949e;
            --cat-merging: #a371f7;
            --cat-other: #7d8590;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--page-bg);
            color: var(--ink);
        }

        a { color: inherit; }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .controls {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls label {
            font-weight: 500;
        }

        .controls select, .controls input[type="text"], .controls button {
            padding: 5px 10px;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background: var(--control-bg);
            color: var(--ink);
            font: inherit;
            font-size: 0.95em;
        }

        .controls button { cursor: pointer; }

        /* Checkbox facets: a <details> disclosure, so the long label list stays out of the way
           until it is wanted. */
        .facet {
            position: relative;
            display: inline-block;
        }

        .facet > summary {
            list-style: none;
            cursor: pointer;
            padding: 6px 11px;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background: var(--control-bg);
            font-size: 0.95em;
            user-select: none;
        }

        .facet > summary::-webkit-details-marker { display: none; }
        .facet > summary::after { content: " \25be"; color: var(--ink-muted); }

        .facet-panel {
            position: absolute;
            z-index: 20;
            top: calc(100% + 4px);
            left: 0;
            min-width: 230px;
            max-height: 320px;
            overflow-y: auto;
            background: var(--panel-bg);
            border: 1px solid var(--rule);
            border-radius: 6px;
            box-shadow: 0 4px 16px var(--shadow);
            padding: 8px;
        }

        .facet-actions {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--rule);
        }

        .facet-actions button {
            flex: 1;
            font-size: 0.85em;
            padding: 3px 6px;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background: var(--control-bg);
            color: var(--ink);
            cursor: pointer;
        }

        .controls .facet-option {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 3px 4px;
            font-weight: 400;
            font-size: 0.92em;
            cursor: pointer;
            white-space: nowrap;
        }

        .controls .facet-option:hover { background: var(--page-bg); }
        .controls .facet-option .count { margin-left: auto; color: var(--ink-muted); font-size: 0.9em; }

        .stats {
            background: var(--panel-bg);
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            margin-bottom: 20px;
            font-size: 14px;
            color: var(--ink-muted);
        }

        .graph-container {
            background: var(--panel-bg);
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        #graph {
            touch-action: none;
        }

        .tooltip {
            position: absolute;
            background: var(--panel-bg);
            color: var(--ink);
            border: 1px solid var(--rule);
            padding: 10px 12px;
            border-radius: 6px;
            pointer-events: none;
            visibility: hidden;
            font-size: 12px;
            max-width: 320px;
            z-index: 1000;
            opacity: 0;
            box-shadow: 0 6px 24px var(--shadow);
            transition: opacity 0.2s;
        }

        .tooltip.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .tooltip-close {
            position: absolute;
            top: 6px;
            right: 6px;
            border: 1px solid var(--rule);
            background: var(--control-bg);
            color: var(--ink);
            border-radius: 4px;
            font-size: 11px;
            line-height: 1;
            padding: 3px 7px;
            cursor: pointer;
        }

        .tooltip h4 {
            margin: 0 0 8px 0;
            padding-right: 44px;
            font-size: 13px;
        }

        .tooltip .pr-meta {
            margin: 4px 0;
            font-size: 11px;
            color: var(--ink-muted);
        }

        .tooltip .pr-meta b { color: var(--ink); font-weight: 600; }

        /* Label chips, matching the main queueboard's span.label (see static/style.css):
           github's own label colour as the background, black or white text by luminance. */
        .tooltip .labels {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 8px;
        }

        span.label {
            border-radius: 5px;
            border: 1px solid transparent;
            display: inline-block;
            padding: 3px 7px;
            font-size: 11px;
            line-height: 1.3;
        }

        span.label.uncoloured {
            border-color: var(--rule);
            color: var(--ink);
        }

        mark {
            background-color: var(--highlight-bg);
            color: inherit;
            padding: 1px 2px;
            border-radius: 2px;
        }

        /* --- graph marks --- */
        .node { cursor: pointer; }
        .node circle.body { stroke: none; }
        .node circle.halo, .node circle.ring { fill: none; }

        /* Size and halo are overwritten per zoom level by applyZoomAwareStyling; the values
           here are only what the first paint uses, before any zoom event has fired. */
        .node text.num {
            font-size: 11px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-weight: 600;
            fill: var(--ink);
            text-anchor: middle;
            paint-order: stroke;
            stroke: var(--panel-bg);
            stroke-width: 3px;
            stroke-linejoin: round;
        }

        .link {
            stroke: var(--edge);
            stroke-opacity: var(--edge-opacity);
            stroke-width: var(--link-width, 1.5px);
            fill: none;
        }

        /* Hover focus: everything outside the hovered PR's component recedes, and the links
           touching the PR itself are drawn in full-strength ink, so a single chain is readable
           inside a dense component grid.

           Adjacency is marked on the edges rather than on the neighbouring nodes. A node cannot
           carry it: an outline around a node already means "blocked by an open PR", and a second
           outline in a different colour reads as a variant of that rather than as a different
           fact. The edges are an unused channel, and they are what adjacency is a property of.
           The arrowhead scales with the line (markerUnits defaults to strokeWidth), so direction
           sharpens along with it for free. */
        .dimmed { opacity: 0.1; }
        .link.incident {
            stroke: var(--ink);
            stroke-opacity: 1;
            stroke-width: var(--link-width-strong, 3.3px);
        }

        .legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: var(--panel-bg-alpha);
            padding: 10px 12px;
            border-radius: 6px;
            font-size: 12px;
            box-shadow: 0 2px 4px var(--shadow);
            user-select: none;
            max-height: calc(100% - 20px);
            overflow-y: auto;
        }

        .legend h4 { margin: 0 0 8px 0; }
        .legend hr { border: none; border-top: 1px solid var(--rule); margin: 8px 0; }

        .zoom-controls {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--panel-bg-alpha);
            padding: 8px;
            border-radius: 6px;
            box-shadow: 0 2px 4px var(--shadow);
            z-index: 10;
            user-select: none;
        }

        .zoom-controls button {
            min-width: 56px;
            height: 32px;
            padding: 0 8px;
            border: 1px solid var(--rule);
            border-radius: 4px;
            background: var(--control-bg);
            color: var(--ink);
            font-size: 14px;
            line-height: 1;
            cursor: pointer;
        }

        .zoom-controls button:hover { background: var(--page-bg); }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 4px 0;
            gap: 8px;
        }

        .legend-color {
            box-sizing: border-box;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            flex: none;
        }

        .legend-note { color: var(--ink-muted); line-height: 1.4; }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--ink-muted);
        }

        @media (max-width: 768px) {
            .zoom-controls {
                top: 8px;
                left: 8px;
                gap: 4px;
                padding: 6px;
            }

            .zoom-controls button {
                min-width: 48px;
                height: 28px;
                padding: 0 6px;
                font-size: 12px;
            }

            .legend {
                top: auto;
                right: 8px;
                bottom: 8px;
                max-width: 220px;
                font-size: 11px;
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>PR Dependency Graph Dashboard</h1>
        <p>Interactive visualization of pull request dependencies in mathlib4</p>
        <p><a href="index.html">&larr; Back to main dashboard</a> | Related: <a href="triage.html">Triage dashboard</a> | <a href="review_dashboard.html">Review queue</a></p>
    </div>

    <div class="controls">
        <div>
            <label for="searchFilter">Search:</label>
            <input type="text" id="searchFilter" placeholder="Search authors, titles, labels..." style="width: 260px;">
        </div>
        <details class="facet" id="labelFacet">
            <summary id="labelFacetSummary">Labels (all)</summary>
            <div class="facet-panel">
                <div class="facet-actions">
                    <button type="button" data-facet="labels" data-action="all">Select all</button>
                    <button type="button" data-facet="labels" data-action="none">Clear</button>
                </div>
                <div id="labelFacetOptions"></div>
            </div>
        </details>
        <details class="facet" id="authorFacet">
            <summary id="authorFacetSummary">Authors (all)</summary>
            <div class="facet-panel">
                <div class="facet-actions">
                    <button type="button" data-facet="authors" data-action="all">Select all</button>
                    <button type="button" data-facet="authors" data-action="none">Clear</button>
                </div>
                <div id="authorFacetOptions"></div>
            </div>
        </details>
        <div>
            <label for="showSingletons">
                <input type="checkbox" id="showSingletons"> Show singletons
            </label>
        </div>
        <div>
            <label for="layoutMode">Layout:</label>
            <select id="layoutMode">
                <option value="columns">Columns (deterministic)</option>
                <option value="force">Force (dynamic)</option>
            </select>
        </div>
        <button type="button" id="resetFiltersBtn">Reset Filters</button>
        <button type="button" id="resetZoomBtn">Reset Zoom</button>
        <button type="button" id="themeToggle" title="Switch to the dark palette">Dark mode</button>
    </div>

    <div class="stats" id="stats">
        Loading dependency data...
    </div>

    <div class="graph-container" id="graphContainer">
        <div class="loading" id="loading">Loading PR dependency graph...</div>
        <svg id="graph"></svg>

        <div class="zoom-controls" aria-label="Graph zoom controls">
            <button type="button" id="zoomInBtn" title="Zoom in" aria-label="Zoom in">+</button>
            <button type="button" id="zoomOutBtn" title="Zoom out" aria-label="Zoom out">-</button>
            <button type="button" id="zoomResetBtn" title="Reset zoom" aria-label="Reset zoom">Reset</button>
        </div>

        <div class="legend" id="legend"></div>
    </div>

    <div class="tooltip" id="tooltip"></div>

    <script>
        let graphData = null;
        let simulation = null;
        let svg = null;
        let g = null;
        let zoom = null;
        let lastTappedNodeId = null;
        let lastTapTs = 0;
        let currentFilter = { search: '', showSingletons: false, layout: 'columns', labels: null, authors: null, focus: null };

        // Per-render lookup tables for the hover highlight and for tooltip placement, rebuilt by
        // createVisualization.
        let componentOfNode = new Map();
        let componentMembers = [];
        let neighboursOfNode = new Map();
        let nodesById = new Map();
        let allLabelNames = [];
        let allAuthorNames = [];

        let graphWidth = window.innerWidth - 40;
        let graphHeight = window.innerHeight - 250;

        // PR-number labels are drawn at a constant *screen* size, so the font, the halo and the
        // gap above the node are all divided back out by the zoom. The threshold is the point
        // where node inflation stops (see applyZoomAwareStyling): below it the view is far
        // enough out that nodes are being drawn larger than life, and a number by each one is
        // noise rather than information.
        const LABEL_FONT_PX = 11;
        const LABEL_HALO_PX = 3;
        const LABEL_GAP_PX = 4;
        const LABEL_ZOOM_THRESHOLD = 0.55;

        // The ring marking "an open PR must land first". It is drawn *outside* the node rather
        // than as a stroke on it, for two reasons: an inner stroke eats the category fill it is
        // supposed to qualify, and it can only ever contrast with that fill -- around 2:1 for
        // these palettes, which is what made it read as a faint outline. Outside, the ring sits
        // against the page instead, where the same colour clears 10:1, and a blocked node is
        // visibly larger as well as ringed. RING_CONTRAST is how far the ring is mixed from the
        // fill towards the text colour: far enough to separate from the background in either
        // theme, near enough to keep the category's hue.
        const RING_WIDTH = 2.5;
        const RING_CONTRAST = 0.7;

        // Clearance for the search/focus halo, which has to stay outside the ring.
        const HALO_GAP = 7;

        // How far the tooltip will travel to stop covering something, in pixels of extra distance
        // from the cursor per unit of coverage. Coverage is measured as a fraction of each mark's
        // own area, weighted by how much it matters, so this is what obscuring one neighbour
        // outright is worth.
        //
        // Set high because the squared fraction above makes it safe to: median distance is 202px
        // anywhere from 200 upwards, so this only moves the hard tail. Measured over 180 hovers
        // across three zoom levels on a 697-PR graph, and again with the graph parked in each
        // corner of the viewport, where the free space is one-sided and the choice is hardest.
        // At 1400 nothing is buried in the centre or the bottom corners, a direct neighbour is
        // never touched anywhere, and no placement lands further than 450px from the cursor.
        const TOOLTIP_COVER_PENALTY = 1400;
        const TOOLTIP_WEIGHT_NEIGHBOUR = 1;
        const TOOLTIP_WEIGHT_COMPONENT = 0.35;
        const TOOLTIP_WEIGHT_OVERLAY = 0.8;

        // Node fill colours, keyed by the category nodeCategory() assigns. Each entry names a CSS
        // custom property (so both themes resolve from one place), the legend text, and the
        // detail shown on hovering the legend entry.
        //
        // Buckets answer "who has the ball?" rather than mirroring PRStatus one-for-one: nine
        // hues are more than colour can carry at a glance, and several PRStatus values differ
        // only in a way that does not change who acts next. Changing the grouping is a change to
        // this table plus nodeCategory(), and nothing else.
        const NODE_CATEGORIES = [
            { key: "queue",    token: "--cat-queue",    label: "On the review queue",
              detail: "Waiting for a reviewer" },
            { key: "author",   token: "--cat-author",   label: "Waiting on the author",
              detail: "awaiting-author, merge conflict, help-wanted or please-adopt" },
            { key: "blocked",  token: "--cat-blocked",  label: "Blocked",
              detail: "Blocked by another PR, or awaiting a Zulip decision" },
            { key: "notready", token: "--cat-notready", label: "Not ready",
              detail: "Draft, WIP, awaiting CI, or CI not passing" },
            { key: "merging",  token: "--cat-merging",  label: "Approved, awaiting merge",
              detail: "maintainer-merge, delegated, ready-to-merge or auto-merge-after-CI" },
            { key: "other",    token: "--cat-other",    label: "Conflicting signals",
              detail: "Signals that cannot all hold at once, most often ready-to-merge while CI is failing" },
        ];

        const CATEGORY_BY_KEY = new Map(NODE_CATEGORIES.map(entry => [entry.key, entry]));

        // Which bucket a PR falls in.
        //
        // Order matters. A maintainer-merge PR is still on the review queue, but it has already
        // been reviewed and a reviewer can take no further action on it, so it is checked first
        // and must not read as "please review me". Queue membership comes next: it is the only
        // field that has applied the base-branch, CI and rule-set checks, so a PR that is
        // *actually* reviewable is always green. Everything else goes by the fork-blind status
        // (pr_status itself is NotFromFork for a large minority of mathlib PRs, decided before
        // labels or CI are examined, so it cannot colour anything on its own).
        function nodeCategory(node) {
            if (node.awaiting_maintainer_merge) return "merging";
            if (node.on_queue) return "queue";
            switch (node.pr_status_ignoring_fork || node.pr_status) {
                case "AwaitingReview": return "queue";
                case "AwaitingAuthor":
                case "MergeConflict":
                case "HelpWanted": return "author";
                case "Blocked":
                case "AwaitingDecision": return "blocked";
                case "NotReady": return "notready";
                case "Delegated":
                case "AwaitingBors": return "merging";
                case "Contradictory": return "other";
                default:
                    // Only reachable for a payload predating pr_status_ignoring_fork; guess from
                    // what the node still carries rather than showing everything as one colour.
                    if (isDraftLike(node)) return "notready";
                    if (node.dependency_count > 0) return "blocked";
                    return "other";
            }
        }

        // --- theme ---
        //
        // Light unless this browser has opted in; the OS preference is not consulted, because
        // every other queueboard page is light-only and a visitor following a link from one of
        // them should not have the page invert under them. The choice is remembered per browser,
        // which is all a display preference needs -- it is not worth a round trip to the API.
        const THEME_STORAGE_KEY = "queueboard-dependency-theme";

        function storedTheme() {
            try {
                return localStorage.getItem(THEME_STORAGE_KEY);
            } catch (error) {
                return null;
            }
        }

        function currentTheme() {
            return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
        }

        // The palette lives in CSS custom properties, so switching themes means re-reading it and
        // repainting both the nodes and the legend.
        function applyTheme(theme, persist) {
            const dark = theme === "dark";
            document.documentElement.dataset.theme = dark ? "dark" : "light";

            const button = document.getElementById("themeToggle");
            button.textContent = dark ? "Light mode" : "Dark mode";
            button.title = dark ? "Switch to the light palette" : "Switch to the dark palette";

            if (persist) {
                try {
                    localStorage.setItem(THEME_STORAGE_KEY, dark ? "dark" : "light");
                } catch (error) {
                    // A browser that refuses storage still gets the switch, just not the memory.
                }
            }

            readPalette();
            renderLegend();
            if (graphData) createVisualization(graphData);
        }

        let palette = new Map();

        function readPalette() {
            const style = getComputedStyle(document.documentElement);
            palette = new Map(NODE_CATEGORIES.map(entry => {
                const fill = (style.getPropertyValue(entry.token) || "").trim() || "#6e7781";
                const ink = style.getPropertyValue("--ink").trim() || "#1f2328";
                return [entry.key, { fill, ring: mixColours(fill, ink, RING_CONTRAST) }];
            }));
        }

        function hexToRgb(hex) {
            const cleaned = String(hex).replace("#", "").trim();
            const full = cleaned.length === 3 ? cleaned.split("").map(c => c + c).join("") : cleaned;
            if (full.length !== 6) return null;
            const value = Number.parseInt(full, 16);
            if (Number.isNaN(value)) return null;
            return [(value >> 16) & 255, (value >> 8) & 255, value & 255];
        }

        function mixColours(from, to, weight) {
            const a = hexToRgb(from);
            const b = hexToRgb(to);
            if (!a || !b) return from;
            const mixed = a.map((value, i) => Math.round(value + (b[i] - value) * weight));
            return "#" + mixed.map(value => value.toString(16).padStart(2, "0")).join("");
        }

        // Github's own rule for label text colour, as ported in dashboard.py's label_link:
        // weight the channels by perceived luminance and pick black or white.
        function isLightColour(hex) {
            const rgb = hexToRgb(hex);
            if (!rgb) return true;
            const [r, gr, b] = rgb;
            return 1 - (0.299 * r + 0.587 * gr + 0.114 * b) / 255 < 0.5;
        }

        function isCoarsePointerDevice() {
            const coarsePrimaryPointer = window.matchMedia("(pointer: coarse)").matches;
            const primaryPointerHasNoHover = window.matchMedia("(hover: none)").matches;
            const touchPoints = navigator.maxTouchPoints || 0;
            return (coarsePrimaryPointer && primaryPointerHasNoHover) || (touchPoints > 0 && primaryPointerHasNoHover);
        }

        function escapeHtml(text) {
            return String(text)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#39;");
        }

        function highlightMatchesSafe(text, searchTerm) {
            const rawText = String(text);
            if (!searchTerm || searchTerm.trim().length === 0) {
                return escapeHtml(rawText);
            }

            const pattern = new RegExp(`(${searchTerm.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi");
            const chunks = rawText.split(pattern);
            return chunks
                .map(chunk => {
                    if (chunk.toLowerCase() === searchTerm.toLowerCase()) {
                        return `<mark>${escapeHtml(chunk)}</mark>`;
                    }
                    return escapeHtml(chunk);
                })
                .join("");
        }

        // The payload carries labels as {name, color, url}; older payloads carried bare strings.
        function labelObjects(node) {
            return (node.labels || []).map(label => (
                typeof label === "string" ? { name: label, color: null } : label
            )).filter(label => label && label.name);
        }

        function labelNames(node) {
            return labelObjects(node).map(label => label.name);
        }

        function renderLabelChips(node, searchTerm) {
            const labels = labelObjects(node);
            if (labels.length === 0) return "";
            const chips = labels.map(label => {
                const name = highlightMatchesSafe(label.name, searchTerm);
                if (!label.color) {
                    return `<span class="label uncoloured">${name}</span>`;
                }
                const background = `#${escapeHtml(label.color)}`;
                const foreground = isLightColour(label.color) ? "#000000" : "#FFFFFF";
                return `<span class="label" style="background: ${background}; color: ${foreground}">${name}</span>`;
            }).join("");
            return `<div class="labels">${chips}</div>`;
        }

        // The page-space boxes of the marks the hover is picking out: the hovered PR's whole
        // component, which is what stays lit while everything else dims. Nodes live in SVG user
        // space, so the zoom transform, the node inflation and the svg's own page offset all have
        // to be applied to get somewhere a tooltip rectangle can be compared against.
        function highlightedScreenBoxes(d) {
            const svgElement = document.getElementById("graph");
            if (!svgElement || !g) return [];

            const members = componentMembers[componentOfNode.get(d.id)];
            if (!members) return [];
            const neighbours = neighboursOfNode.get(d.id) || new Set();

            const rect = svgElement.getBoundingClientRect();
            const originX = rect.left + window.scrollX;
            const originY = rect.top + window.scrollY;
            const transform = d3.zoomTransform(svgElement);
            const compensation = nodeCompensationFor(transform.k);
            // The PR number sits above the node once it is showing, and is part of the mark.
            const labelHeight = transform.k >= LABEL_ZOOM_THRESHOLD ? LABEL_FONT_PX + LABEL_GAP_PX : 0;

            const boxes = [];
            for (const id of members) {
                const node = nodesById.get(id);
                if (!node || typeof node.x !== "number" || typeof node.y !== "number") continue;
                const [x, y] = transform.apply([node.x, node.y]);
                const radius = getRingRadius(node) * compensation * transform.k;
                boxes.push({
                    left: originX + x - radius,
                    right: originX + x + radius,
                    top: originY + y - radius - labelHeight,
                    bottom: originY + y + radius,
                    // The hovered PR and the PRs its incident links point at are what the reader
                    // is looking at; the rest of the component is context and can be clipped.
                    weight: id === d.id || neighbours.has(id) ? TOOLTIP_WEIGHT_NEIGHBOUR : TOOLTIP_WEIGHT_COMPONENT,
                });
            }
            return boxes;
        }

        // The page furniture the tooltip should also stay off. Both sit in corners, which is
        // exactly where the placement search falls back to when a component leaves no room beside
        // the cursor -- and the legend in particular explains the colours being read.
        function overlayScreenBoxes() {
            const boxes = [];
            for (const selector of [".legend", ".zoom-controls"]) {
                const element = document.querySelector(selector);
                if (!element) continue;
                const rect = element.getBoundingClientRect();
                if (rect.width === 0 || rect.height === 0) continue;
                boxes.push({
                    left: rect.left + window.scrollX,
                    right: rect.right + window.scrollX,
                    top: rect.top + window.scrollY,
                    bottom: rect.bottom + window.scrollY,
                    weight: TOOLTIP_WEIGHT_OVERLAY,
                });
            }
            return boxes;
        }

        function positionTooltip(event, d) {
            const tooltip = document.getElementById("tooltip");
            let anchorX;
            let anchorY;
            if (typeof event.pageX === "number" && typeof event.pageY === "number") {
                anchorX = event.pageX;
                anchorY = event.pageY;
            } else {
                const svgElement = document.getElementById("graph");
                const rect = svgElement.getBoundingClientRect();
                anchorX = rect.left + window.scrollX + (d.x || graphWidth / 2);
                anchorY = rect.top + window.scrollY + (d.y || graphHeight / 2);
            }

            const margin = 8;
            const tooltipWidth = tooltip.offsetWidth;
            const tooltipHeight = tooltip.offsetHeight;
            const viewportLeft = window.scrollX;
            const viewportTop = window.scrollY;
            const viewportRight = viewportLeft + window.innerWidth;
            const viewportBottom = viewportTop + window.innerHeight;
            const gap = 14;
            const exclusion = 28;

            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            function overlapArea(a, b) {
                const xOverlap = Math.max(0, Math.min(a.right, b.right) - Math.max(a.left, b.left));
                const yOverlap = Math.max(0, Math.min(a.bottom, b.bottom) - Math.max(a.top, b.top));
                return xOverlap * yOverlap;
            }

            const avoid = highlightedScreenBoxes(d).concat(overlayScreenBoxes());

            // Kept out of the cost and enforced as a hard constraint instead: a placement that
            // sits under the pointer is not a cheaper placement, it is an unusable one.
            const cursorBox = {
                left: anchorX - exclusion,
                right: anchorX + exclusion,
                top: anchorY - exclusion,
                bottom: anchorY + exclusion,
            };

            // Candidates: the tooltip pushed away from the cursor along a ring of headings, at
            // increasing distance, each placed to already clear the cursor's exclusion box on
            // that heading -- so staying off the pointer is geometry rather than something the
            // cost has to buy.
            const headings = 16;
            const steps = 6;
            const stepPx = 70;
            const candidates = [];
            for (let index = 0; index < headings; index += 1) {
                const angle = (2 * Math.PI * index) / headings;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                // A rect centred this far out escapes the exclusion box as soon as it clears on
                // either axis, so the smaller of the two requirements is the binding one.
                const clearX = Math.abs(cos) > 1e-6 ? (tooltipWidth / 2 + exclusion) / Math.abs(cos) : Number.POSITIVE_INFINITY;
                const clearY = Math.abs(sin) > 1e-6 ? (tooltipHeight / 2 + exclusion) / Math.abs(sin) : Number.POSITIVE_INFINITY;
                const start = Math.min(clearX, clearY) + gap;
                for (let step = 0; step < steps; step += 1) {
                    const distance = start + step * stepPx;
                    candidates.push({
                        left: anchorX + cos * distance - tooltipWidth / 2,
                        top: anchorY + sin * distance - tooltipHeight / 2,
                    });
                }
            }
            // Plus a grid over the whole placement area, corners included. Near a viewport edge
            // the ring's outward candidates are clamped back inside, where they collapse onto one
            // another and back towards the cursor -- so precisely where the graph is pushed into
            // a corner, the search was running out of distinct places to try. The grid keeps a
            // spread of well-separated positions available wherever the cursor sits, and since
            // the cost already prefers the nearest clean spot, extra positions can only improve
            // the choice.
            const gridColumns = 12;
            const gridRows = 9;
            const minLeft = viewportLeft + margin;
            const maxLeft = Math.max(minLeft, viewportRight - tooltipWidth - margin);
            const minTop = viewportTop + margin;
            const maxTop = Math.max(minTop, viewportBottom - tooltipHeight - margin);
            for (let column = 0; column < gridColumns; column += 1) {
                for (let row = 0; row < gridRows; row += 1) {
                    candidates.push({
                        left: minLeft + ((maxLeft - minLeft) * column) / (gridColumns - 1),
                        top: minTop + ((maxTop - minTop) * row) / (gridRows - 1),
                    });
                }
            }

            // Distance from the cursor, in pixels, plus what it would obscure priced in the same
            // unit. Coverage counts as a fraction of each mark's own area, so clipping the corner
            // of a node is cheap and sitting squarely on it is not, and the tooltip gives up
            // proximity only in proportion to what it would hide.
            function costOf(rect) {
                let coverage = 0;
                for (const box of avoid) {
                    const overlap = overlapArea(rect, box);
                    if (overlap === 0) continue;
                    const boxArea = Math.max(1, (box.right - box.left) * (box.bottom - box.top));
                    const fraction = Math.min(1, overlap / boxArea);
                    // Squared, because grazing a node's edge and hiding it are not the same thing
                    // to a reader, and a cost linear in the fraction treats them as differing
                    // only by degree. Squaring makes a slight clip nearly free while leaving full
                    // burial at full price, so the penalty can be set high enough that the
                    // tooltip never buries anything without it fleeing over every small overlap.
                    coverage += box.weight * fraction * fraction;
                }
                const centreX = (rect.left + rect.right) / 2;
                const centreY = (rect.top + rect.bottom) / 2;
                const distance = Math.hypot(centreX - anchorX, centreY - anchorY);
                return distance + TOOLTIP_COVER_PENALTY * coverage;
            }

            let best = null;
            let bestCost = Number.POSITIVE_INFINITY;
            let onCursor = null;
            let onCursorCost = Number.POSITIVE_INFINITY;

            for (const candidate of candidates) {
                const left = clamp(candidate.left, minLeft, maxLeft);
                const top = clamp(candidate.top, minTop, maxTop);
                const rect = {
                    left,
                    top,
                    right: left + tooltipWidth,
                    bottom: top + tooltipHeight,
                };
                const cost = costOf(rect);

                // Clamping can drag a ring candidate back over the pointer, and a grid position
                // may start there. A tooltip under the cursor is dismissed by the next small
                // movement, so these are held back and used only if nothing else fits at all.
                if (overlapArea(rect, cursorBox) > 0) {
                    if (cost < onCursorCost) {
                        onCursorCost = cost;
                        onCursor = { left, top };
                    }
                    continue;
                }

                if (cost < bestCost) {
                    bestCost = cost;
                    best = { left, top };
                }
            }

            const chosen = best || onCursor;
            tooltip.style.left = `${chosen.left}px`;
            tooltip.style.top = `${chosen.top}px`;
        }

        // Which way a dependency points is the first thing to become unreadable as you zoom
        // out, so the head is larger than the line warrants and fully opaque. markerUnits
        // defaults to strokeWidth, so it grows with the link compensation for free; refX is in
        // viewBox units, and 20 pulls the tip back far enough to clear a node wearing the
        // "blocked" ring.
        function appendArrowMarker(target) {
            target.append("defs").append("marker")
                .attr("id", "arrowhead")
                .attr("viewBox", "0 -5 10 10")
                .attr("refX", 20)
                .attr("refY", 0)
                .attr("markerWidth", 8)
                .attr("markerHeight", 8)
                .attr("orient", "auto")
                .append("path")
                .attr("d", "M0,-3.5L10,0L0,3.5")
                .attr("class", "arrowhead")
                .style("fill", "var(--edge)");
        }

        // Nodes are drawn larger than life when zoomed out so they stay visible, capped to avoid
        // heavy overlap. Anything reasoning about a node's size on screen has to apply the same
        // inflation, so it lives here rather than inline in applyZoomAwareStyling.
        function nodeCompensationFor(scaleK) {
            return Math.min(1.9, Math.max(1, 0.55 / Math.max(scaleK, 0.0001)));
        }

        function initializeSVG() {
            zoom = d3.zoom()
                .scaleExtent([0.05, 10])
                .on("zoom", (event) => {
                    g.attr("transform", event.transform);
                    applyZoomAwareStyling(event.transform.k);
                });

            svg = d3.select("#graph")
                .attr("width", graphWidth)
                .attr("height", graphHeight)
                .call(zoom);

            appendArrowMarker(svg);
            g = svg.append("g");
        }

        function applyZoomAwareStyling(scaleK) {
            if (!g) return;
            const k = Math.max(scaleK, 0.0001);

            const nodeCompensation = nodeCompensationFor(k);
            const linkCompensation = Math.min(2.2, Math.max(1, 0.5 / k));

            g.selectAll("circle.body")
                .attr("r", d => getNodeRadius(d) * nodeCompensation);

            // The ring has to grow with the node it surrounds, or zooming out thins it away --
            // which is most of why it looked faint from a distance.
            g.selectAll("circle.ring")
                .attr("r", d => getRingRadius(d) * nodeCompensation)
                .style("stroke-width", RING_WIDTH * nodeCompensation);

            g.selectAll("circle.halo")
                .attr("r", d => (getNodeRadius(d) + HALO_GAP) * nodeCompensation)
                .style("stroke-width", `${3 * nodeCompensation}px`);

            // PR numbers only appear once they can be read without colliding; their halo, font
            // size and offset are in user space, so all three divide the zoom back out. Keeping
            // the gap constant on screen matters: a fixed user-space offset drifts away from the
            // node as you zoom in and collides with it as you zoom out.
            g.selectAll("text.num")
                .attr("y", d => -(getRingRadius(d) * nodeCompensation + LABEL_GAP_PX / k))
                .style("font-size", `${LABEL_FONT_PX / k}px`)
                .style("stroke-width", `${LABEL_HALO_PX / k}px`)
                .style("display", k >= LABEL_ZOOM_THRESHOLD ? null : "none");

            // Two custom properties on the container rather than an inline width on each of ~700
            // links: the cascade then stays free for .link.incident, which an inline width would
            // beat, and it is two writes per zoom instead of one per link. The emphasised width is
            // multiplied out here rather than in a CSS calc(), so the stylesheet only ever has to
            // substitute a plain value.
            const linkWidth = 1.5 * linkCompensation;
            g.style("--link-width", `${linkWidth}px`);
            g.style("--link-width-strong", `${linkWidth * 2.2}px`);
        }

        function fitGraphToViewport(duration = 350) {
            if (!g || !svg) return;
            const gNode = g.node();
            if (!gNode) return;

            const bbox = gNode.getBBox();
            if (!Number.isFinite(bbox.width) || !Number.isFinite(bbox.height) || bbox.width <= 0 || bbox.height <= 0) {
                return;
            }

            const viewportWidth = graphWidth;
            const viewportHeight = graphHeight;
            const legend = document.getElementById("legend");
            const legendWidth = legend && window.innerWidth > 768 ? legend.offsetWidth + 24 : 20;
            const reservedLeft = 84;
            const reservedTop = 52;
            const reservedRight = legendWidth;
            const reservedBottom = 20;
            const availableWidth = Math.max(1, viewportWidth - reservedLeft - reservedRight);
            const availableHeight = Math.max(1, viewportHeight - reservedTop - reservedBottom);

            const scale = Math.max(
                0.05,
                Math.min(
                    2.5,
                    Math.min(
                        availableWidth / bbox.width,
                        availableHeight / bbox.height
                    )
                )
            );

            const centerX = bbox.x + bbox.width / 2;
            const centerY = bbox.y + bbox.height / 2;
            const targetCenterX = reservedLeft + availableWidth / 2;
            const targetCenterY = reservedTop + availableHeight / 2;
            const tx = targetCenterX - scale * centerX;
            const ty = targetCenterY - scale * centerY;
            const transform = d3.zoomIdentity.translate(tx, ty).scale(scale);

            // Keep panning bounded around the graph, while allowing a little exploration slack.
            const panMarginX = Math.max(140, bbox.width * 0.25);
            const panMarginY = Math.max(100, bbox.height * 0.25);
            zoom.translateExtent([
                [bbox.x - panMarginX, bbox.y - panMarginY],
                [bbox.x + bbox.width + panMarginX, bbox.y + bbox.height + panMarginY],
            ]);

            svg.transition().duration(duration).call(zoom.transform, transform);
        }

        async function loadData() {
            try {
                const data = await d3.json("dependency_graph.json");
                graphData = data;

                collectFacetOptions(data);
                renderFacet("labels", allLabelNames);
                renderFacet("authors", allAuthorNames);
                updateFacetSummaries();

                readPalette();
                renderLegend();
                createVisualization(data);
                document.getElementById("loading").style.display = "none";
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById("loading").innerHTML =
                    "Error loading dependency data. Please ensure dependency_graph.json is available.";
            }
        }

        function isDraftLike(node) {
            return node.is_draft || labelNames(node).some(label => label.toLowerCase().includes('wip'));
        }

        function getNodeColor(node) {
            return (palette.get(nodeCategory(node)) || { fill: "#6e7781" }).fill;
        }

        // A ring marks a PR that cannot merge yet because an open PR must land first. This is a
        // separate channel from the fill, so "what state is it in" and "is it blocked" read at once.
        function hasBlockingDependency(node) {
            return node.dependency_count > 0;
        }

        function getRingColor(node) {
            return (palette.get(nodeCategory(node)) || { ring: "#1f2328" }).ring;
        }

        // Centred on the node's edge + half the width, so the ring lies wholly outside the fill.
        function getRingRadius(node) {
            return getNodeRadius(node) + RING_WIDTH / 2;
        }

        function getNodeRadius() {
            return 8;
        }

        function renderLegend() {
            const legend = document.getElementById("legend");
            const swatches = NODE_CATEGORIES.map(entry => {
                const fill = (palette.get(entry.key) || {}).fill;
                return `<div class="legend-item" title="${escapeHtml(entry.detail)}">`
                    + `<div class="legend-color" style="background: ${fill}"></div>${escapeHtml(entry.label)}</div>`;
            }).join("");
            const ringFill = (palette.get("blocked") || {}).fill;
            const ringStroke = (palette.get("blocked") || {}).ring;
            legend.innerHTML = `
                <h4>Legend</h4>
                ${swatches}
                <hr>
                <div class="legend-item">
                    <div class="legend-color" style="background: ${ringFill}; box-shadow: 0 0 0 ${RING_WIDTH}px ${ringStroke}"></div>
                    Blocked by an open PR
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background: transparent; border: 2px dashed var(--ink-muted)"></div>
                    Search / filter match
                </div>
                <div class="legend-item">
                    <div style="width: 12px; height: 2px; background: var(--edge); flex: none;"></div>
                    <span class="legend-note">A &rarr; B: A depends on B, so B merges first</span>
                </div>`;
        }

        function createNodeAndLinkElements(filteredNodes, cleanLinks, draggable) {
            const link = g.append("g")
                .attr("class", "links")
                .selectAll("path")
                .data(cleanLinks)
                .enter().append("path")
                .attr("class", "link dependency")
                .attr("marker-end", "url(#arrowhead)");

            // A group per node, so the fill, the "blocked" ring, the match halo and the PR
            // number are separate marks that cannot compete for the same attribute.
            const nodeSelection = g.append("g")
                .attr("class", "nodes")
                .selectAll("g")
                .data(filteredNodes)
                .enter().append("g")
                .attr("class", d => {
                    let classes = `node ${d.state}`;
                    if (d.is_draft) classes += " draft";
                    if (d.isSearchMatch) classes += " search-match";
                    if (d.isFocused) classes += " focused";
                    return classes;
                });

            nodeSelection.filter(d => d.isSearchMatch || d.isFocused)
                .append("circle")
                .attr("class", "halo")
                .attr("r", d => getNodeRadius(d) + HALO_GAP)
                .style("stroke", d => d.isFocused ? "var(--ink)" : "var(--ink-muted)")
                .style("stroke-width", "3px")
                .style("stroke-dasharray", d => d.isFocused ? null : "3 2");

            nodeSelection.filter(hasBlockingDependency)
                .append("circle")
                .attr("class", "ring")
                .attr("r", getRingRadius)
                .style("stroke", getRingColor)
                .style("stroke-width", RING_WIDTH);

            nodeSelection.append("circle")
                .attr("class", "body")
                .attr("r", getNodeRadius)
                .style("fill", getNodeColor);

            nodeSelection.append("text")
                .attr("class", "num")
                .attr("y", -(getNodeRadius() + 3))
                .style("display", "none")
                .text(d => d.id);

            nodeSelection
                .on("mouseenter", (event, d) => { highlightRelated(d); showTooltip(event, d); })
                .on("mouseleave", () => { clearHighlight(); hideTooltip(); })
                .on("click", (event, d) => {
                    event.stopPropagation();
                    if (!isCoarsePointerDevice()) {
                        window.open(d.url, "_blank", "noopener");
                        return;
                    }

                    const now = Date.now();
                    const isSecondTap = lastTappedNodeId === d.id && now - lastTapTs < 1200;

                    if (isSecondTap) {
                        window.open(d.url, "_blank", "noopener");
                        return;
                    }

                    highlightRelated(d);
                    showTooltip(event, d);
                    lastTappedNodeId = d.id;
                    lastTapTs = now;
                });

            if (draggable) {
                nodeSelection.call(
                    d3.drag()
                        .on("start", dragstarted)
                        .on("drag", dragged)
                        .on("end", dragended)
                );
            }

            return { link, nodeSelection };
        }

        function highlightRelated(node) {
            if (!g) return;
            const component = componentOfNode.get(node.id);
            g.selectAll("g.node")
                .classed("dimmed", d => componentOfNode.get(d.id) !== component);
            g.selectAll("path.link")
                .classed("dimmed", d => componentOfNode.get(linkEndpointId(d.source)) !== component)
                .classed("incident", d => linkEndpointId(d.source) === node.id || linkEndpointId(d.target) === node.id);
        }

        function clearHighlight() {
            if (!g) return;
            g.selectAll("g.node").classed("dimmed", false);
            g.selectAll("path.link").classed("dimmed", false).classed("incident", false);
        }

        function linkEndpointId(endpoint) {
            return typeof endpoint === "object" && endpoint !== null ? endpoint.id : endpoint;
        }

        function linkEndpointsById(cleanLinks, nodeMap) {
            return cleanLinks.map(link => ({
                ...link,
                sourceNode: nodeMap.get(link.source),
                targetNode: nodeMap.get(link.target),
            }));
        }

        function updateStaticLinks(linkSelection) {
            linkSelection.attr("d", d => {
                return `M${d.sourceNode.x},${d.sourceNode.y}L${d.targetNode.x},${d.targetNode.y}`;
            });
        }

        function buildAdjacency(nodes, links) {
            const adjacency = new Map(nodes.map(node => [node.id, new Set()]));
            links.forEach(link => {
                const source = linkEndpointId(link.source);
                const target = linkEndpointId(link.target);
                adjacency.get(source)?.add(target);
                adjacency.get(target)?.add(source);
            });
            return adjacency;
        }

        function connectedComponents(nodes, links) {
            const adjacency = buildAdjacency(nodes, links);

            const visited = new Set();
            const components = [];

            const sortedIds = nodes.map(node => node.id).sort((a, b) => a - b);
            sortedIds.forEach(startId => {
                if (visited.has(startId)) return;
                const stack = [startId];
                const ids = [];
                visited.add(startId);
                while (stack.length > 0) {
                    const id = stack.pop();
                    ids.push(id);
                    const neighbors = Array.from(adjacency.get(id) || []).sort((a, b) => a - b);
                    neighbors.forEach(neighborId => {
                        if (!visited.has(neighborId)) {
                            visited.add(neighborId);
                            stack.push(neighborId);
                        }
                    });
                }
                ids.sort((a, b) => a - b);
                components.push(ids);
            });

            components.sort((a, b) => {
                if (b.length !== a.length) return b.length - a.length;
                return a[0] - b[0];
            });
            return components;
        }

        function layoutComponentColumns(componentIds, depMap, nodeMap) {
            const rankMemo = new Map();

            function rankFor(nodeId, stack = new Set()) {
                if (rankMemo.has(nodeId)) return rankMemo.get(nodeId);
                if (stack.has(nodeId)) return 0;
                stack.add(nodeId);

                const deps = (depMap.get(nodeId) || []).filter(depId => componentIds.has(depId));
                const rank = deps.length === 0 ? 0 : 1 + Math.max(...deps.map(depId => rankFor(depId, stack)));

                stack.delete(nodeId);
                rankMemo.set(nodeId, rank);
                return rank;
            }

            const rows = new Map();
            Array.from(componentIds).sort((a, b) => a - b).forEach(nodeId => {
                const rank = rankFor(nodeId);
                if (!rows.has(rank)) rows.set(rank, []);
                rows.get(rank).push(nodeId);
            });

            rows.forEach(ids => {
                ids.sort((a, b) => {
                    const nodeA = nodeMap.get(a);
                    const nodeB = nodeMap.get(b);
                    if (nodeB.dependent_count !== nodeA.dependent_count) {
                        return nodeB.dependent_count - nodeA.dependent_count;
                    }
                    return nodeA.id - nodeB.id;
                });
            });

            const rowSpacing = 110;
            const colSpacing = 95;
            const orderedRanks = Array.from(rows.keys()).sort((a, b) => a - b);
            const maxRowLength = Math.max(...orderedRanks.map(rank => rows.get(rank).length));
            const componentWidth = Math.max(1, (maxRowLength - 1) * colSpacing + 80);
            const componentHeight = Math.max(1, (orderedRanks.length - 1) * rowSpacing + 80);

            const positions = new Map();
            orderedRanks.forEach((rank, rowIndex) => {
                const rowIds = rows.get(rank);
                const rowWidth = (rowIds.length - 1) * colSpacing;
                rowIds.forEach((nodeId, idx) => {
                    const x = idx * colSpacing - rowWidth / 2;
                    const y = rowIndex * rowSpacing - componentHeight / 2 + 40;
                    positions.set(nodeId, { x, y });
                });
            });

            return { positions, width: componentWidth, height: componentHeight };
        }

        function applyColumnsLayout(filteredNodes, cleanLinks) {
            const nodeMap = new Map(filteredNodes.map(node => [node.id, node]));
            const depMap = new Map(filteredNodes.map(node => [node.id, []]));
            cleanLinks.forEach(link => {
                if (depMap.has(link.source)) {
                    depMap.get(link.source).push(link.target);
                }
            });

            const components = connectedComponents(filteredNodes, cleanLinks);
            const componentLayouts = components.map(ids => {
                return layoutComponentColumns(new Set(ids), depMap, nodeMap);
            });

            const maxComponentWidth = Math.max(1, ...componentLayouts.map(layout => layout.width));
            const maxComponentHeight = Math.max(1, ...componentLayouts.map(layout => layout.height));
            const componentGapX = 120;
            const componentGapY = 120;
            const cellWidth = maxComponentWidth + componentGapX;
            const cellHeight = maxComponentHeight + componentGapY;
            const columns = Math.max(1, Math.ceil(Math.sqrt(componentLayouts.length)));

            componentLayouts.forEach((layout, idx) => {
                const gridX = idx % columns;
                const gridY = Math.floor(idx / columns);
                const baseX = 80 + gridX * cellWidth + cellWidth / 2;
                const baseY = 80 + gridY * cellHeight + cellHeight / 2;

                layout.positions.forEach((pos, nodeId) => {
                    const node = nodeMap.get(nodeId);
                    node.x = baseX + pos.x;
                    node.y = baseY + pos.y;
                });
            });

            return linkEndpointsById(cleanLinks, nodeMap);
        }

        function createForceLayout(filteredNodes, cleanLinks) {
            simulation = d3.forceSimulation(filteredNodes)
                .force("link", d3.forceLink(cleanLinks).id(d => d.id).distance(50))
                .force("charge", d3.forceManyBody().strength(-200))
                .force("center", d3.forceCenter(graphWidth / 2, graphHeight / 2))
                .force("collision", d3.forceCollide().radius(d => getNodeRadius(d) + 2));

            const { link, nodeSelection } = createNodeAndLinkElements(filteredNodes, cleanLinks, true);

            simulation.on("tick", () => {
                link.attr("d", d => `M${d.source.x},${d.source.y}L${d.target.x},${d.target.y}`);
                nodeSelection.attr("transform", d => `translate(${d.x},${d.y})`);
            });

            simulation.alpha(1).restart();
        }

        function createColumnsLayout(filteredNodes, cleanLinks) {
            const linksWithNodes = applyColumnsLayout(filteredNodes, cleanLinks);
            const { link, nodeSelection } = createNodeAndLinkElements(filteredNodes, linksWithNodes, false);

            updateStaticLinks(link);
            nodeSelection.attr("transform", d => `translate(${d.x},${d.y})`);
        }

        function createVisualization(data) {
            closeTooltip();

            // Clean slate approach: destroy existing simulation and clear SVG
            if (simulation) {
                simulation.stop();
                simulation = null;
            }

            svg.selectAll("*").remove();
            appendArrowMarker(svg);
            g = svg.append("g");

            const filteredData = filterData(data);

            // Ensure clean link data with ID references
            const cleanLinks = filteredData.links.map(link => ({
                source: linkEndpointId(link.source),
                target: linkEndpointId(link.target),
                source_state: link.source_state,
                target_state: link.target_state
            }));

            // Lookup tables for the hover highlight, over the *rendered* graph.
            componentOfNode = new Map();
            componentMembers = connectedComponents(filteredData.nodes, cleanLinks);
            componentMembers.forEach((ids, index) => {
                ids.forEach(id => componentOfNode.set(id, index));
            });
            neighboursOfNode = buildAdjacency(filteredData.nodes, cleanLinks);
            nodesById = new Map(filteredData.nodes.map(node => [node.id, node]));

            svg.attr("width", graphWidth).attr("height", graphHeight);
            if (currentFilter.layout === "force") {
                createForceLayout(filteredData.nodes, cleanLinks);
                // Force layout is dynamic: fit after a short delay once positions settle a bit.
                setTimeout(() => fitGraphToViewport(250), 200);
                setTimeout(() => fitGraphToViewport(250), 900);
            } else {
                createColumnsLayout(filteredData.nodes, cleanLinks);
                fitGraphToViewport(250);
            }

            updateFilteredStats(data.metadata, filteredData);
        }

        // Map every node to the component it belongs to, plus the members of each component.
        // Computed once per filter pass: expanding each match to its component one DFS at a time
        // re-walks the whole graph per match, which is the difference between instant and
        // noticeable when a broad label filter matches a few hundred PRs.
        function componentIndex(nodes, links) {
            const components = connectedComponents(nodes, links);
            const indexOf = new Map();
            components.forEach((ids, index) => ids.forEach(id => indexOf.set(id, index)));
            return { components, indexOf };
        }

        // A facet with everything selected (null) or nothing selected (an empty set, i.e. the
        // user has just hit "Clear" and not yet picked anything) places no restriction: landing
        // on an empty graph is never what was wanted.
        function facetSelects(kind, values) {
            const selected = currentFilter[kind];
            if (selected === null || selected.size === 0) return true;
            return values.some(value => selected.has(value));
        }

        function facetIsRestricting(kind) {
            const selected = currentFilter[kind];
            return selected !== null && selected.size > 0;
        }

        function filterData(data) {
            let matchingNodes = new Set();
            let connectedComponentNodes = new Set();

            const searchTerm = (currentFilter.search || "").trim().toLowerCase();
            const hasSearchTerm = searchTerm.length > 0;
            const hasFacet = facetIsRestricting("labels") || facetIsRestricting("authors");
            const focusId = currentFilter.focus;
            const hasFocus = focusId !== null;
            const isSeeded = hasSearchTerm || hasFacet || hasFocus;

            let availableNodes;
            if (currentFilter.showSingletons || hasFocus) {
                // A focused PR may well have no dependencies at all; hiding it would make the
                // link from the queueboard land on an empty graph.
                availableNodes = data.nodes;
            } else {
                // Filter out singletons - nodes with no dependencies or dependents
                availableNodes = data.nodes.filter(node =>
                    node.dependency_count > 0 || node.dependent_count > 0
                );
            }

            availableNodes.forEach(node => {
                if (hasFocus) {
                    if (node.id === focusId) matchingNodes.add(node.id);
                    return;
                }

                const names = labelNames(node);
                if (!facetSelects("labels", names)) return;
                if (!facetSelects("authors", [node.author || "unknown"])) return;

                if (hasSearchTerm) {
                    const searchableText = [
                        String(node.author || "").toLowerCase(),
                        String(node.title || "").toLowerCase(),
                        String(node.id),
                        ...names.map(label => label.toLowerCase())
                    ].join(' ');
                    if (!searchableText.includes(searchTerm)) return;
                }

                matchingNodes.add(node.id);
            });

            // Show whole connected components around the matches, so a match's blockers are
            // visible even when they do not match themselves.
            if (matchingNodes.size > 0 && isSeeded) {
                const { components, indexOf } = componentIndex(availableNodes, data.links);
                const wanted = new Set();
                matchingNodes.forEach(nodeId => {
                    const index = indexOf.get(nodeId);
                    if (index !== undefined) wanted.add(index);
                });
                wanted.forEach(index => components[index].forEach(id => connectedComponentNodes.add(id)));
            } else if (!isSeeded) {
                availableNodes.forEach(node => connectedComponentNodes.add(node.id));
            }

            const filteredNodes = data.nodes.filter(node =>
                connectedComponentNodes.has(node.id)
            ).map(node => ({
                ...node,
                isSearchMatch: isSeeded && !hasFocus && matchingNodes.has(node.id),
                isFocused: hasFocus && node.id === focusId
            }));

            // A ?focus= pointing at a PR this snapshot no longer contains (merged, closed)
            // would otherwise render a blank page; fall back to the unfiltered graph and say so.
            const focusMissing = hasFocus && matchingNodes.size === 0;
            if (focusMissing) {
                availableNodes.forEach(node => {
                    if (node.dependency_count > 0 || node.dependent_count > 0 || currentFilter.showSingletons) {
                        connectedComponentNodes.add(node.id);
                    }
                });
            }

            const filteredLinks = data.links.filter(link => {
                const sourceId = linkEndpointId(link.source);
                const targetId = linkEndpointId(link.target);
                return connectedComponentNodes.has(sourceId) && connectedComponentNodes.has(targetId);
            });

            return { nodes: filteredNodes, links: filteredLinks, focusMissing };
        }

        function updateFilteredStats(metadata, filteredData) {
            const onQueue = metadata.prs_on_queue;
            const queuePart = typeof onQueue === "number" ? ` | On the review queue: ${onQueue}` : "";
            const shownOnQueue = filteredData.nodes.filter(node => node.on_queue).length;
            let focusPart = "";
            if (currentFilter.focus !== null) {
                focusPart = filteredData.focusMissing
                    ? ` | <b>PR #${currentFilter.focus} is not in this snapshot</b> (merged or closed?), showing everything`
                    : ` | Focused on PR #${currentFilter.focus}`;
            }

            document.getElementById("stats").innerHTML = `
                Total PRs: ${metadata.total_prs} |
                PRs with dependencies: ${metadata.prs_with_dependencies} |
                PRs that are dependencies: ${metadata.prs_that_are_dependencies} |
                Dependency links: ${metadata.dependency_links}${queuePart} |
                Showing: ${filteredData.nodes.length} PRs, ${filteredData.links.length} dependencies, ${shownOnQueue} on the queue${focusPart}
            `;
        }

        function showTooltip(event, d) {
            const tooltip = document.getElementById("tooltip");
            const searchTerm = currentFilter.search ? currentFilter.search.trim() : '';

            const additions = d.additions || 0;
            const deletions = d.deletions || 0;
            const totalChanges = additions + deletions;
            const diffText = totalChanges > 0
                ? `<span style="color: var(--cat-queue);">+${additions}</span>/<span style="color: var(--cat-blocked);">-${deletions}</span> (${totalChanges} lines)`
                : "No changes";

            const highlightedTitle = highlightMatchesSafe(d.title, searchTerm);
            const highlightedAuthor = highlightMatchesSafe(d.author || "unknown", searchTerm);
            const highlightedPrNumber = highlightMatchesSafe(String(d.id), searchTerm);

            const category = CATEGORY_BY_KEY.get(nodeCategory(d));
            const statusColour = getNodeColor(d);
            const statusName = category ? category.label : "Unclassified";
            const rawStatus = d.pr_status ? ` <span style="opacity: 0.7">(${escapeHtml(d.pr_status)})</span>` : "";
            // Worth spelling out: these PRs sit on the review queue but are not a reviewer's job.
            const queueNote = d.awaiting_maintainer_merge && d.on_queue
                ? `<div class="pr-meta">On the review queue, but labelled <b>maintainer-merge</b></div>` : "";

            const downstream = d.downstream_count;
            const upstream = d.upstream_count;
            const unblocksText = typeof downstream === "number"
                ? `${downstream} PR${downstream === 1 ? "" : "s"} (${d.dependent_count} directly)`
                : `${d.dependent_count} directly`;
            const blockedText = typeof upstream === "number"
                ? `${upstream} PR${upstream === 1 ? "" : "s"} (${d.dependency_count} directly)`
                : `${d.dependency_count} directly`;

            const ciText = d.ci_status ? `<div class="pr-meta">CI: ${escapeHtml(d.ci_status)}</div>` : "";
            const matchText = d.isSearchMatch
                ? `<div class="pr-meta"><b>Matches the current filter</b></div>` : '';
            const openHint = isCoarsePointerDevice()
                ? `<div class="pr-meta">Tap same node again to open PR</div>`
                : `<div class="pr-meta">Click to open PR</div>`;
            const closeButton = isCoarsePointerDevice()
                ? `<button class="tooltip-close" type="button" id="tooltipCloseBtn" aria-label="Close details">Close</button>`
                : "";

            tooltip.innerHTML = `
                ${closeButton}
                <h4>PR #${highlightedPrNumber}: ${highlightedTitle}</h4>
                <div class="pr-meta">Author: <b>${highlightedAuthor}</b></div>
                <div class="pr-meta">Status: <b style="color: ${statusColour}">${escapeHtml(statusName)}</b>${rawStatus}</div>
                ${queueNote}
                ${ciText}
                <div class="pr-meta">Diff: ${diffText}</div>
                <div class="pr-meta">Unblocks: <b>${unblocksText}</b></div>
                <div class="pr-meta">Blocked by: <b>${blockedText}</b></div>
                ${renderLabelChips(d, searchTerm)}
                ${matchText}
                ${openHint}
            `;

            const closeBtn = document.getElementById("tooltipCloseBtn");
            if (closeBtn) closeBtn.addEventListener("click", closeTooltip);

            positionTooltip(event, d);
            tooltip.classList.add("visible");
        }

        function hideTooltip() {
            document.getElementById("tooltip").classList.remove("visible");
        }

        function closeTooltip(event) {
            if (event) {
                event.stopPropagation();
            }
            lastTappedNodeId = null;
            lastTapTs = 0;
            clearHighlight();
            hideTooltip();
        }

        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }

        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }

        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }

        /* ---------- label / author facets ---------- */

        function collectFacetOptions(data) {
            const labels = new Map();
            const authors = new Map();
            data.nodes.forEach(node => {
                labelNames(node).forEach(name => labels.set(name, (labels.get(name) || 0) + 1));
                const author = node.author || "unknown";
                authors.set(author, (authors.get(author) || 0) + 1);
            });
            const byName = (a, b) => a.localeCompare(b, undefined, { sensitivity: "base" });
            allLabelNames = [...labels.keys()].sort(byName).map(name => [name, labels.get(name)]);
            allAuthorNames = [...authors.keys()].sort(byName).map(name => [name, authors.get(name)]);

            // Drop any URL-supplied selection that no longer matches a real value, so a stale
            // bookmark cannot silently show an empty graph.
            ["labels", "authors"].forEach(kind => {
                const known = new Set((kind === "labels" ? allLabelNames : allAuthorNames).map(entry => entry[0]));
                if (currentFilter[kind] === null) return;
                const kept = new Set([...currentFilter[kind]].filter(value => known.has(value)));
                currentFilter[kind] = kept.size === 0 || kept.size === known.size ? null : kept;
            });
        }

        function renderFacet(kind, options) {
            const container = document.getElementById(kind === "labels" ? "labelFacetOptions" : "authorFacetOptions");
            container.innerHTML = "";
            options.forEach(([value, count]) => {
                const wrapper = document.createElement("label");
                wrapper.className = "facet-option";

                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = value;
                checkbox.checked = currentFilter[kind] === null || currentFilter[kind].has(value);
                checkbox.addEventListener("change", () => readFacetSelection(kind));

                const text = document.createElement("span");
                text.textContent = value;

                const badge = document.createElement("span");
                badge.className = "count";
                badge.textContent = count;

                wrapper.append(checkbox, text, badge);
                container.appendChild(wrapper);
            });
        }

        function facetCheckboxes(kind) {
            const container = document.getElementById(kind === "labels" ? "labelFacetOptions" : "authorFacetOptions");
            return [...container.querySelectorAll('input[type="checkbox"]')];
        }

        function readFacetSelection(kind) {
            const boxes = facetCheckboxes(kind);
            const checked = boxes.filter(box => box.checked).map(box => box.value);
            // null means "all"; an empty set means the user cleared the list and is about to
            // pick a few. Both show everything (see facetSelects), but they are different
            // states of the checkboxes, so "Clear" must not silently re-tick them all.
            currentFilter[kind] = checked.length === boxes.length ? null : new Set(checked);
            updateFacetSummaries();
            applyFilters();
        }

        function setFacetSelection(kind, allSelected) {
            facetCheckboxes(kind).forEach(box => { box.checked = allSelected; });
            readFacetSelection(kind);
        }

        function updateFacetSummaries() {
            [["labels", "labelFacetSummary", "Labels", allLabelNames], ["authors", "authorFacetSummary", "Authors", allAuthorNames]]
                .forEach(([kind, id, title, options]) => {
                    const selected = currentFilter[kind];
                    let text;
                    if (selected === null) {
                        text = "all";
                    } else if (selected.size === 0) {
                        text = "none picked, showing all";
                    } else {
                        text = `${selected.size}/${options.length}`;
                    }
                    document.getElementById(id).textContent = `${title} (${text})`;
                });
        }

        /* ---------- filter plumbing ---------- */

        function syncFacetCheckboxes() {
            ["labels", "authors"].forEach(kind => {
                const selected = currentFilter[kind];
                facetCheckboxes(kind).forEach(box => {
                    box.checked = selected === null || selected.has(box.value);
                });
            });
        }

        function applyFilters() {
            writeFiltersToURL();
            if (graphData) {
                createVisualization(graphData);
            }
        }

        // |clearFocus| is set by the controls that mean "I want a different set of PRs now"
        // (typing a search, resetting); changing the layout or toggling singletons keeps the
        // PR the queueboard linked to in view.
        function updateFilters(clearFocus = false) {
            currentFilter.search = document.getElementById("searchFilter").value;
            currentFilter.showSingletons = document.getElementById("showSingletons").checked;

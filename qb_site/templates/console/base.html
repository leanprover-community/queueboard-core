<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Reviewer console{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.5;
           max-width: 760px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    h1 { font-size: 1.5rem; margin-bottom: .25rem; }
    .meta { color: #6b7280; font-size: .9rem; margin-top: 0; }
    .repo { margin-top: 1.75rem; }
    .repo-title { font-size: 1.15rem; margin: 0 0 .1rem; padding-bottom: .3rem; border-bottom: 2px solid #d1d5db; }
    .card { border: 1px solid #d1d5db; border-radius: 10px; padding: 1rem; margin: .75rem 0; }
    .card h3 { font-size: 1.02rem; font-weight: 600; margin: 0 0 .25rem; }
    .labels { margin: .35rem 0; }
    .label { display: inline-block; font-size: .78rem; background: #eef2ff; color: #3730a3;
             border-radius: 999px; padding: .1rem .55rem; margin: .1rem .2rem .1rem 0; }
    .expiry { font-size: .85rem; color: #6b7280; }
    .actions { margin-top: .75rem; display: flex; gap: .5rem; }
    button { font: inherit; padding: .45rem .9rem; border-radius: 8px; border: 1px solid transparent; cursor: pointer; }
    button.accept { background: #16a34a; color: #fff; }
    button.decline { background: #fff; color: #b91c1c; border-color: #b91c1c; }
    button.linklike { background: none; border: none; color: #2563eb; text-decoration: underline; padding: 0; }
    .btn { display: inline-block; background: #111827; color: #fff; padding: .55rem 1rem;
           border-radius: 8px; text-decoration: none; }
    .empty { color: #6b7280; }
    .loadline { font-size: .9rem; color: #374151; margin: .1rem 0 .5rem; }
    .loadline.at-capacity { color: #b91c1c; font-weight: 600; }
    .section-title { font-size: .92rem; font-weight: 600; color: #374151; margin: 1rem 0 .35rem; }
    ul.assigned { list-style: none; padding: 0; margin: .25rem 0; }
    .assigned-row { font-size: .9rem; padding: .3rem 0; border-bottom: 1px solid #eef0f3; }
    .assigned-row.off-queue { opacity: .72; }
    .assigned-row .status { color: #6b7280; font-size: .82rem; margin-left: .4rem; }
    .flag { display: inline-block; font-size: .72rem; background: #fef3c7; color: #92400e;
            border-radius: 999px; padding: .05rem .5rem; margin-left: .4rem; }
    form.inline { display: inline; }
    @media (prefers-color-scheme: dark) {
      body { background: #0b0f19; color: #e5e7eb; }
      .repo-title { border-bottom-color: #374151; }
      .card { border-color: #374151; }
      .label { background: #1e1b4b; color: #c7d2fe; }
      .btn { background: #e5e7eb; color: #0b0f19; }
      .loadline { color: #d1d5db; }
      .loadline.at-capacity { color: #f87171; }
      .section-title { color: #d1d5db; }
      .assigned-row { border-bottom-color: #1f2937; }
      .flag { background: #422006; color: #fcd34d; }
    }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
  <script>
    // Render server-emitted UTC timestamps in the viewer's own timezone (progressive enhancement;
    // each <time> keeps a readable "… UTC" text fallback when JS is unavailable).
    (function () {
      var fmt;
      try {
        fmt = new Intl.DateTimeFormat(undefined, { dateStyle: "medium", timeStyle: "short" });
      } catch (e) { return; }
      document.querySelectorAll("time[datetime]").forEach(function (el) {
        var iso = el.getAttribute("datetime");
        if (!iso) { return; }
        var d = new Date(iso);
        if (!isNaN(d.getTime())) { el.textContent = fmt.format(d); }
      });
    })();
  </script>
</body>
</html>

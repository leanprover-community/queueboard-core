# Page through all labels defined on a repository, ordered by name.
# Variables:
#   $owner: String!, $name: String!, $first: Int!, $after: String

query RepoLabels($owner: String!, $name: String!, $first: Int!, $after: String) {
  rateLimit { cost remaining resetAt used }
  repository(owner: $owner, name: $name) {
    labels(first: $first, after: $after, orderBy: {field: NAME, direction: ASC}) {
      pageInfo { hasNextPage endCursor }
      nodes { name color }
    }
  }
}

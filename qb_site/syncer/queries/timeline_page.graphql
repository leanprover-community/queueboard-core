# Timeline items page for a single PR
# Variables:
#   $owner: String!, $name: String!, $number: Int!
#   $first: Int!, $after: String
#   $since: DateTime (optional lower bound)

query PRTimelinePage($owner: String!, $name: String!, $number: Int!, $first: Int!, $after: String, $since: DateTime) {
  rateLimit { cost remaining resetAt used }
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      timelineItems(
        first: $first
        after: $after
        since: $since
        itemTypes: [
          LABELED_EVENT
          UNLABELED_EVENT
          READY_FOR_REVIEW_EVENT
          CONVERT_TO_DRAFT_EVENT
          REOPENED_EVENT
          CLOSED_EVENT
          HEAD_REF_FORCE_PUSHED_EVENT
        ]
      ) {
        pageInfo { hasNextPage endCursor }
        nodes {
          __typename
          ... on LabeledEvent { id createdAt label { name } }
          ... on UnlabeledEvent { id createdAt label { name } }
          ... on ReadyForReviewEvent { id createdAt }
          ... on ConvertToDraftEvent { id createdAt }
          ... on ReopenedEvent { id createdAt }
          ... on ClosedEvent { id createdAt }
          ... on HeadRefForcePushedEvent { id createdAt beforeCommit { oid } afterCommit { oid } }
        }
      }
    }
  }
}

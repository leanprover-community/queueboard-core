# Timeline items page for a single PR
# Variables:
#   $owner: String!, $name: String!, $number: Int!
#   $first: Int!, $after: String
#   $since: DateTime (optional lower bound)

query PRTimelinePage($owner: String!, $name: String!, $number: Int!, $first: Int!, $after: String, $since: DateTime) {
  rateLimit { cost remaining resetAt used }
  repository(owner: $owner, name: $name) {
    pullRequest(number: $number) {
      timelineItems(
        first: $first
        after: $after
        since: $since
        itemTypes: [
          LABELED_EVENT
          UNLABELED_EVENT
          ASSIGNED_EVENT
          UNASSIGNED_EVENT
          READY_FOR_REVIEW_EVENT
          CONVERT_TO_DRAFT_EVENT
          REOPENED_EVENT
          CLOSED_EVENT
          HEAD_REF_FORCE_PUSHED_EVENT
        ]
      ) {
        pageInfo { hasNextPage endCursor hasPreviousPage startCursor }
        nodes {
          __typename
          ... on LabeledEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            label { name }
          }
          ... on UnlabeledEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            label { name }
          }
          ... on AssignedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            assignee { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on UnassignedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            assignee { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ReadyForReviewEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ConvertToDraftEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ReopenedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ClosedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on HeadRefForcePushedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            beforeCommit { oid }
            afterCommit { oid }
          }
        }
      }
    }
  }
}

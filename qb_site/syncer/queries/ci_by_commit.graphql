# CI contexts by commit SHA
# Variables:
#   $owner: String!, $name: String!, $sha: GitObjectID!
#   $first: Int!, $after: String

query CIByCommit($owner: String!, $name: String!, $sha: GitObjectID!, $first: Int!, $after: String) {
  rateLimit { cost remaining resetAt used }
  repository(owner: $owner, name: $name) {
    object(oid: $sha) {
      __typename
      ... on Commit {
        oid
        statusCheckRollup {
          contexts(first: $first, after: $after) {
            pageInfo { hasNextPage endCursor }
            nodes {
              __typename
              ... on CheckRun {
                id
                name
                status
                conclusion
                startedAt
                completedAt
                detailsUrl
                externalId
              }
              ... on StatusContext {
                id
                context
                state
                targetUrl
                description
                createdAt
              }
            }
          }
        }
        associatedPullRequests(first: 20) {
          nodes {
            number
            repository { owner { login } name }
          }
        }
      }
    }
  }
}

# GitHub GraphQL bundle for a single PR
# Variables:
#   $owner: String!, $name: String!, $number: Int!
#   $timelineK: Int!  (max timeline items to fetch)
#   $commitsM: Int!   (number of head commits to inspect)
#   $inlineCommentsPerReview: Int! (max inline comments per PullRequestReview)
#   $timelineSince: DateTime (optional lower bound for timeline items)

query PRBundle($owner: String!, $name: String!, $number: Int!, $timelineK: Int!, $commitsM: Int!, $inlineCommentsPerReview: Int!, $timelineSince: DateTime) {
  rateLimit { cost remaining resetAt used }
  repository(owner: $owner, name: $name) {
    id
    name
    owner { login }
    defaultBranchRef { name }
    pullRequest(number: $number) {
      number
      state
      isDraft
      title
      body
      createdAt
      updatedAt
      closedAt
      mergedAt
      baseRefName
      headRefName
      headRefOid
      headRepositoryOwner { login }
      headRepository { name }
      additions
      deletions
      changedFiles

      files(first: 100) {
        pageInfo { hasNextPage endCursor }
        nodes {
          path
          changeType
          additions
          deletions
        }
      }

      assignees(first: 100) {
        totalCount
        pageInfo { hasNextPage }
        nodes {
          id
          login
          name
          avatarUrl
        }
      }

      reviews(first: 100) {
        totalCount
        pageInfo { hasNextPage }
        nodes {
          id
          state
          submittedAt
          author {
            __typename
            ... on User { id login name avatarUrl }
            ... on Bot { id login avatarUrl }
          }
        }
      }

      comments(first: 100) {
        totalCount
        pageInfo { hasNextPage }
        nodes {
          id
          createdAt
          author {
            __typename
            ... on User { id login name avatarUrl }
            ... on Bot { id login avatarUrl }
          }
        }
      }

      reviewThreads(first: 100) {
        totalCount
        pageInfo { hasNextPage }
        nodes {
          comments(first: 1) {
            totalCount
          }
        }
      }

      author {
        __typename
        ... on User { id login name avatarUrl }
        ... on Bot { id login avatarUrl }
      }

      labels(first: 100) {
        nodes { name color }
      }

      timelineItems(
        first: $timelineK
        since: $timelineSince
        itemTypes: [
          LABELED_EVENT
          UNLABELED_EVENT
          ASSIGNED_EVENT
          UNASSIGNED_EVENT
          READY_FOR_REVIEW_EVENT
          CONVERT_TO_DRAFT_EVENT
          REOPENED_EVENT
          CLOSED_EVENT
          HEAD_REF_FORCE_PUSHED_EVENT
          ISSUE_COMMENT
          PULL_REQUEST_REVIEW
          REVIEW_DISMISSED_EVENT
          REVIEW_REQUESTED_EVENT
          REVIEW_REQUEST_REMOVED_EVENT
        ]
      ) {
        pageInfo { hasNextPage endCursor hasPreviousPage startCursor }
        nodes {
          __typename
          ... on LabeledEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            label { name }
          }
          ... on UnlabeledEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            label { name }
          }
          ... on AssignedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            assignee { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on UnassignedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            assignee { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ReadyForReviewEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ConvertToDraftEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ReopenedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on ClosedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on HeadRefForcePushedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            beforeCommit { oid }
            afterCommit { oid }
          }
          ... on IssueComment {
            id
            createdAt
            author { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
          }
          ... on PullRequestReview {
            id
            submittedAt
            state
            author { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            comments(first: $inlineCommentsPerReview) {
              totalCount
              pageInfo { hasNextPage }
              nodes {
                id
                createdAt
                path
                line
                originalLine
                replyTo { id }
                author { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
              }
            }
          }
          ... on ReviewDismissedEvent {
            id
            createdAt
            previousReviewState
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            review { id submittedAt author { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } } }
          }
          ... on ReviewRequestedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Team { slug }
              ... on Mannequin { login }
              ... on Bot { login }
            }
          }
          ... on ReviewRequestRemovedEvent {
            id
            createdAt
            actor { __typename ... on User { login } ... on Bot { login } ... on Mannequin { login } }
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Team { slug }
              ... on Mannequin { login }
              ... on Bot { login }
            }
          }
        }
      }

      commits(last: $commitsM) {
        pageInfo {
          hasPreviousPage
          startCursor
        }
        nodes {
          commit {
            committedDate
            oid
            statusCheckRollup {
              state
              contexts(first: 100) {
                nodes {
                  __typename
                  ... on CheckRun {
                    id
                    name
                    status
                    conclusion
                    startedAt
                    completedAt
                    detailsUrl
                    externalId
                  }
                  ... on StatusContext {
                    id
                    context
                    state
                    targetUrl
                    description
                    createdAt
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
